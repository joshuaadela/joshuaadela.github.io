{%- assign person_id = site.url | append: '/#person' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ person_id }}",
      "name": "Joshua Adela",
      "givenName": "Joshua",
      "familyName": "Adela",
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}/assets/img/og-image.png",
      "email": {{ site.email | prepend: 'mailto:' | jsonify }},
      "jobTitle": {{ site.job_title | jsonify }},
      "description": {{ site.description | strip | jsonify }},
      "knowsAbout": {{ site.knows_about | jsonify }},
      "hasOccupation": {
        "@type": "Occupation",
        "name": {{ site.job_title | jsonify }},
        "skills": {{ site.knows_about | join: ', ' | jsonify }}
      },
      "sameAs": {{ site.same_as | jsonify }}
    }{% if page.url == '/' %},
    {
      "@type": "ProfilePage",
      "@id": "{{ site.url }}/#profile",
      "url": "{{ site.url }}/",
      "name": {{ site.title | append: ' · ' | append: site.tagline | jsonify }},
      "inLanguage": "en",
      "dateModified": "{{ site.time | date_to_xmlschema }}",
      "mainEntity": { "@id": "{{ person_id }}" }
    },
    {
      "@type": "FAQPage",
      "@id": "{{ site.url }}/#faq",
      "mainEntity": [
        {%- for item in site.data.faq %}
        {
          "@type": "Question",
          "name": {{ item.q | jsonify }},
          "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | strip | jsonify }} }
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }{% endif %}
  ]
}
</script>
