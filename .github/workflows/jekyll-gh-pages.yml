# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Lets a game repo trigger a redeploy after it changes (event type: game-updated)
  repository_dispatch:
    types: [game-updated]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Games: pull each game from its own (private) repo, build the client and
      # serve it under /games/<slug>/. Needs the GAME_REPO_DEPLOY_KEY secret
      # (a read-only deploy key on the game repo); skipped if it is missing.
      - name: Check game repo access
        id: games
        env:
          KEY: ${{ secrets.GAME_REPO_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::warning::GAME_REPO_DEPLOY_KEY not set; skipping game builds"; fi
      - name: Checkout Inyo
        if: steps.games.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: joshuaadela/01-survival-and-io
          ref: main
          ssh-key: ${{ secrets.GAME_REPO_DEPLOY_KEY }}
          path: .games/inyo
      - name: Setup Node
        if: steps.games.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .games/inyo/.nvmrc
          cache: npm
          cache-dependency-path: .games/inyo/package-lock.json
      - name: Build Inyo
        if: steps.games.outputs.enabled == 'true'
        working-directory: .games/inyo
        run: |
          npm ci
          npm run build -w client -- --base ./
          # Keep the game out of search results, like the /games/ page.
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' client/dist/index.html
          sudo mkdir -p "$GITHUB_WORKSPACE/_site/games/inyo"
          sudo cp -r client/dist/. "$GITHUB_WORKSPACE/_site/games/inyo/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
